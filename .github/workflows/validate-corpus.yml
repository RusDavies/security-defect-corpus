name: Validate corpus

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate corpus metadata
        run: python3 scripts/validate_corpus.py

      - name: Run safe harnesses
        run: python3 scripts/run_safe_harnesses.py

      - name: Run CVE evidence packet suite
        run: python3 scripts/run_cve_packet_suite.py
